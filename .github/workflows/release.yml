name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write   # cosign keyless OIDC
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          test "$TAG" = "$PKG" || { echo "tag $TAG != pyproject version $PKG"; exit 1; }

      - name: Unit tests (pytest)
        run: |
          python -m pip install -r requirements.txt
          python -m pytest tests/ -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bomscope-web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/bomscope-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/bomscope-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (syft / SPDX)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}/bomscope-web:${{ github.ref_name }}
          artifact-name: bomscope-sbom-${{ github.ref_name }}.spdx.json

      - name: Sign image (cosign, keyless)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.3"

      - name: Cosign sign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/bomscope-web:${{ github.ref_name }} \
            ghcr.io/${{ github.repository }}/bomscope-web:latest

      - name: Generate changelog notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF' > notes.md
          import os, re, sys
          ver = os.environ["TAG"].lstrip("v")
          cl = open("CHANGELOG.md").read()
          m = re.search(r"## \[?" + re.escape(ver) + r"[^]]*\]?.*?(?=\n## |\Z)", cl, re.S)
          sys.stdout.write(m.group(0).strip() if m else f"# {os.environ['TAG']}\n\nSee CHANGELOG.md.")
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach SBOM to release
        run: |
          ls bomscope-sbom-*.spdx.json
          for f in bomscope-sbom-*.spdx.json; do
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
