name: Analyze Dependencies and Deploy Viewer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform (gitlab, github, ado)'
        required: true
        default: 'github'
      organization:
        description: 'Organization/Group name'
        required: true
      source_url:
        description: 'Platform URL (e.g., https://gitlab.com)'
        required: false
        default: 'https://github.com'
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  analyze-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run dependency analysis
        env:
          PLATFORM: ${{ github.event.inputs.platform || secrets.PLATFORM || 'github' }}
          SOURCE: ${{ github.event.inputs.source_url || secrets.SOURCE || 'https://github.com' }}
          TOKEN: ${{ secrets.PLATFORM_TOKEN }}
          ORG: ${{ github.event.inputs.organization || secrets.ORGANIZATION }}
          CHAINGUARD_PYTHON_USERNAME: ${{ secrets.CHAINGUARD_PYTHON_USERNAME }}
          CHAINGUARD_PYTHON_PASSWORD: ${{ secrets.CHAINGUARD_PYTHON_PASSWORD }}
          CHAINGUARD_JAVA_USERNAME: ${{ secrets.CHAINGUARD_JAVA_USERNAME }}
          CHAINGUARD_JAVA_PASSWORD: ${{ secrets.CHAINGUARD_JAVA_PASSWORD }}
        run: |
          python3 main.py \
            -p "$PLATFORM" \
            -s "$SOURCE" \
            -t "$TOKEN" \
            -o "$ORG" \
            -O viewer/public/analysis.json \
            --coverage \
            -v
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Node dependencies
        run: npm install
      
      - name: Build viewer
        run: npm run build
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Summary
        run: |
          echo "## Analysis Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your dependency analysis has been completed and deployed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View Results:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
